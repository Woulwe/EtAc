<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APK → EXE Converter</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080b12;color:#f4f7ff;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:42px 18px}.card{background:#111722;border:1px solid #273244;border-radius:28px;padding:30px;box-shadow:0 20px 70px #0009}h1{font-size:40px;margin:0 0 10px}.sub{color:#9ba8bb;line-height:1.6;margin-bottom:25px}.drop{display:block;text-align:center;padding:55px 18px;border:2px dashed #3978ff;border-radius:22px;background:#0c1320;cursor:pointer}.drop:hover{background:#101a2b}.icon{font-size:52px}.drop b{display:block;font-size:20px;margin:12px 0 7px}.hint{color:#8794a8}input{display:none}.file{margin-top:18px;color:#dce5f2}.row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}button,.download{border:0;border-radius:14px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none}button{background:#3978ff;color:#fff}button:disabled{opacity:.5}.download{background:#20b574;color:#fff}.status{display:none;margin-top:20px;padding:15px;border-radius:14px;background:#0b1019;color:#c4cfdf}.bar{display:none;height:8px;background:#222c3b;border-radius:20px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:#3978ff;transition:.3s}.note{margin-top:25px;padding:16px;border-radius:15px;background:#18140b;color:#d3c39b;font-size:14px;line-height:1.55}@media(max-width:600px){h1{font-size:30px}.card{padding:20px}}</style></head><body><main class="wrap"><section class="card"><h1>APK → EXE</h1><div class="sub">Загрузи Android APK — сервер подготовит Windows-пакет.</div><label class="drop" id="drop"><div class="icon">📦</div><b>Выбрать APK</b><span class="hint">или перетащи файл сюда · до 500 МБ</span><input id="file" type="file" accept=".apk"></label><div class="file" id="fileName"></div><div class="bar" id="bar"><div class="fill" id="fill"></div></div><div class="status" id="status"></div><div class="row"><button id="convert" disabled>Конвертировать</button><a id="download" class="download" hidden>Скачать ZIP</a></div><div class="note"><b>Важно:</b> APK нельзя универсально превратить в нативный Windows EXE простым переименованием. Этот проект создаёт Windows-пакет с APK и launcher.</div></section></main><script>const d=document.getElementById("drop"),f=document.getElementById("file"),n=document.getElementById("fileName"),go=document.getElementById("convert"),st=document.getElementById("status"),bar=document.getElementById("bar"),fill=document.getElementById("fill"),dl=document.getElementById("download");let chosen;function pick(x){if(!x)return;if(!x.name.toLowerCase().endsWith(".apk")){st.style.display="block";st.textContent="Нужен APK-файл";return}chosen=x;n.textContent="Выбран: "+x.name+" · "+(x.size/1048576).toFixed(1)+" МБ";go.disabled=false;dl.hidden=true;st.style.display="none"}d.onclick=()=>f.click();f.onchange=()=>pick(f.files[0]);["dragenter","dragover"].forEach(e=>d.addEventListener(e,x=>{x.preventDefault()}));d.addEventListener("drop",e=>{e.preventDefault();pick(e.dataTransfer.files[0])});go.onclick=async()=>{go.disabled=true;bar.style.display="block";fill.style.width="30%";st.style.display="block";st.textContent="Загрузка APK...";const fd=new FormData;fd.append("apk",chosen);try{fill.style.width="60%";st.textContent="Создание пакета...";const r=await fetch("/api/convert",{method:"POST",body:fd}),j=await r.json();if(!r.ok)throw Error(j.error);fill.style.width="100%";st.textContent="Готово!";dl.href=j.download;dl.download=j.filename;dl.hidden=false}catch(e){fill.style.width="0";st.textContent="Ошибка: "+e.message}finally{go.disabled=false}}</script></body></html>
